schema_version: "0.1"
attestor: gitlab-review
description: >-
  gitlab-review proven from a REAL merged GitLab merge request on gitlab.com
  Ultimate: MR !1 of testifysec/judge-parity-sandbox/binding-probe-20260929080449
  (project 87019852), created 2026-09-29 by the parity lane's binding probe. The
  approver (a sandbox bot user) first approved on the parent sha, then the head
  d7c95a09 was pushed; GitLab later reset that approval, the approver approved
  on the head, and the MR merged as 5c1a098c. The twelve endpoints the attestor
  reads were captured from gitlab.com as the attestor identity (Maintainer,
  read_api), each trimmed to exactly the fields its DTOs read (real values, no
  synthesis). attestation.json was produced by running cilock against the LIVE
  gitlab.com API once (attest -a gitlab-review, project 87019852, sha 5c1a098c),
  showing tier ultimate detected by probe and the one approval bound to exactly
  the head sha under the default 60 s clock guard. Every real username is
  replaced with a placeholder in the captures, the note bodies and the payload,
  so attestation.json is an UNSIGNED sanitized recording (signatures: []), not
  signed evidence; it does not demonstrate signature verification.

  http-mock replays the captured endpoints. The API base is the attestor's
  api-url option, bound to the stub; the attestor appends its own paths (query
  strings such as per_page and sha are ignored by the stub). Volatile fields:
  fetched_at (wall clock), instance.api_url and instance.host (gitlab.com live, the stub's
  localhost port in replay). No token is committed; GITLAB_REVIEW_TOKEN below is
  a stub the mock ignores, and token_source records only the variable name.
setup:
  mode: http-mock
  env:
    GITLAB_REVIEW_TOKEN: "stub-not-a-real-token"
  options:
    project: "87019852"
    sha: "5c1a098c9e6fc12a2ef3cb2ac220d5e40725c2ff"
    endpoints:
      - option: api-url
        file: version.json
        path: /version
      - option: api-url
        file: project-approvals.json
        path: /projects/87019852/approvals
      - option: api-url
        file: external-status-checks.json
        path: /projects/87019852/external_status_checks
      - option: api-url
        file: commit-mrs.json
        path: /projects/87019852/repository/commits/5c1a098c9e6fc12a2ef3cb2ac220d5e40725c2ff/merge_requests
      - option: api-url
        file: mr.json
        path: /projects/87019852/merge_requests/1
      - option: api-url
        file: versions.json
        path: /projects/87019852/merge_requests/1/versions
      - option: api-url
        file: approvals.json
        path: /projects/87019852/merge_requests/1/approvals
      - option: api-url
        file: approval-state.json
        path: /projects/87019852/merge_requests/1/approval_state
      - option: api-url
        file: pipelines.json
        path: /projects/87019852/pipelines
      - option: api-url
        file: statuses.json
        path: /projects/87019852/repository/commits/d7c95a09fb23e86fe66c0f1ec50dffa368ad938d/statuses
      - option: api-url
        file: discussions.json
        path: /projects/87019852/merge_requests/1/discussions
      - option: api-url
        file: notes.json
        path: /projects/87019852/merge_requests/1/notes
recording:
  tool: cilock
  version: "dev"
  binary_sha256: "47ce328ff30b202fcca032c8db638636454a88ea4f39039ad642643c6c773cd0"
  recorded_with: cilock
  attestation: attestation.json
  argv: ["true"]
  recorded_at: "2026-09-29"
expect:
  predicate_type: https://aflock.ai/attestations/gitlab-review/v0.1
  run_type: prematerial
  subjects:
    match: prefix
    keys:
      - "commitsha:5c1a098c9e6fc12a2ef3cb2ac220d5e40725c2ff"
      - "mrhead:d7c95a09fb23e86fe66c0f1ec50dffa368ad938d"
      - "project:"
      - "mergerequest:"
      - "approver:"
  redact:
    - "fetched_at"
    - "instance.api_url"
    - "instance.host"
