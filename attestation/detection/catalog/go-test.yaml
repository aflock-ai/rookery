apiVersion: cilock.detection/v0.1
name: go-test
detection_only: true

description: go test — Go test runner.

category: [unit-test]

upstream:
  name: go test
  source: "https://pkg.go.dev/cmd/go"
  license: BSD-3-Clause
  vendor: Google / Go Authors

emits_formats: [test-results]

pre:
  match:
    any_of:
      - argv_prefix: [go, test]
      - argv_regex: "^(\\S*/)?go -C(=| )\\S+ test( |$)"

llm_hints:
  on_match: "go test invocation observed. go test writes no JUnit: run it through gotestsum (--junitfile) so test-results captures the report."
