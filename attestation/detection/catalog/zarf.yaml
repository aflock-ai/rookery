apiVersion: cilock.detection/v0.1
name: zarf
detection_only: true

description: "Zarf — air-gap-native package manager for Kubernetes; `zarf package create` assembles a self-contained deploy bundle (declared in zarf.yaml), `zarf init` / `zarf package deploy` apply it to a cluster."

category: [build, deploy]
primary_category: build

upstream:
  name: Zarf
  source: "https://github.com/zarf-dev/zarf"
  license: Apache-2.0
  vendor: "Zarf project (zarf-dev, TSC-governed; created by Defense Unicorns)"

recommended_trace: light

pre:
  match:
    any_of:
      - argv_prefix: [zarf, package, create]
      - argv_prefix: [zarf, package]
      - argv_prefix: [zarf, init]
      - argv_prefix: [zarf, dev]

llm_hints:
  on_match: "zarf invocation observed. `zarf package create` output tarball (zarf-package-*.tar.zst) + zarf.yaml captured by product/material attestors; command-run records the literal zarf argv."
