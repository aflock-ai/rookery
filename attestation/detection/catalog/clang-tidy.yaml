apiVersion: cilock.detection/v0.1
name: clang-tidy
detection_only: true

description: "clang-tidy: LLVM's C and C++ linter, driven by a compilation database and the repository's .clang-tidy checks."

category: [lint]

upstream:
  name: clang-tidy
  source: "https://clang.llvm.org/extra/clang-tidy/"
  license: Apache-2.0 WITH LLVM-exception
  vendor: LLVM Project

pre:
  match:
    argv_prefix: [clang-tidy]

llm_hints:
  on_match: "clang-tidy observed. It exits 0 when checks fire; only --warnings-as-errors=<checks> makes a finding fail the command, so require that flag and the command-run exit code. Findings are text on stdout (no SARIF); -p <build> names the compile_commands.json."
