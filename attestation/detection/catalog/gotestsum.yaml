apiVersion: cilock.detection/v0.1
name: gotestsum
detection_only: true

description: "gotestsum: runs go test -json and writes JUnit XML."

category: [unit-test]

upstream:
  name: gotestsum
  source: "https://github.com/gotestyourself/gotestsum"
  license: Apache-2.0
  vendor: gotestyourself

emits_formats: [test-results]

pre:
  match:
    any_of:
      - argv_prefix: [gotestsum]
      - argv_prefix: [go, tool, gotestsum]
      - argv_regex: "^(\\S*/)?go (-C(=| )\\S+ )?run gotest\\.tools/gotestsum(@\\S+)?( |$)"

llm_hints:
  on_match: "gotestsum observed. --junitfile <path> writes JUnit XML (one testcase per test and subtest), captured by test-results."
